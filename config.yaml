search:
  roles:
    - "Product Manager Intern"
    - "AI Product Manager Intern"
    - "APM Intern"
    - "Associate Product Manager Intern"
  locations:
    - "United States"
    - "Remote"
  date_posted: "week"  # past24hours, week, month

scraping:
  max_pages: 3
  rate_limit_seconds: 5

email_finder:
  provider: "hunter"
  max_lookups_per_run: 20

resume:
  base_resume_path: "base_resume.txt"
  output_dir: "output/resumes"
  ai_provider: "anthropic"  # anthropic or openai

email_outreach:
  enabled: true
  daily_send_limit: 30
  from_name: "Mohak Garg"
  follow_up_days: 5

scheduler:
  interval_hours: 1

notifications:
  slack_enabled: false
  slack_channel: "#job-hunt"
